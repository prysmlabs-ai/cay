[package]
name = "cay-program"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reader for the DarwiNN Edge TPU executable format. Port of libedgetpu's executable schema (Apache-2.0)."
repository = "https://github.com/prysmlabs-ai/cay"
keywords = ["edgetpu", "coral", "flatbuffers", "parser", "tpu"]
categories = ["parser-implementations", "hardware-support"]

[lib]
name = "cay_program"
path = "src/lib.rs"

[dependencies]
planus = "1.3"
# planus's generated owned types derive Serialize/Deserialize; serde must resolve.
serde = { version = "1", features = ["derive"] }
