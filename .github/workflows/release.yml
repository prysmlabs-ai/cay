# Synced from a private monorepo; edits made here return as a pull request.
# Paths are relative to the published repo root.
#
# Tag vX.Y.Z publishes the crate to crates.io and the wheels to PyPI. Both use
# trusted publishing, so no token is stored anywhere.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      # The tag is the release. If it disagrees with either manifest, stop
      # before publishing under a version nobody asked for.
      - name: Check the tag matches both manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' cay/Cargo.toml | cut -d'"' -f2)"
          wheel="$(grep -m1 '^version' cay-py/pyproject.toml | cut -d'"' -f2)"
          for got in "$crate" "$wheel"; do
            if [[ "$got" != "$tag" ]]; then
              echo "tag $tag disagrees: crate $crate, wheel $wheel" >&2
              exit 1
            fi
          done

      - run: cargo test
      - run: cargo publish --dry-run --manifest-path cay/Cargo.toml

  crates-io:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --manifest-path cay/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - if: runner.os == 'macOS'
        run: brew install libusb
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path cay-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  pypi:
    needs: wheels
    runs-on: ubuntu-latest
    # PyPI's trusted publisher is registered against this environment, so the
    # name here must match what is configured there.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
